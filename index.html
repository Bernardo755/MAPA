<script>


/***************************************************************
 * =============================================================
 * 01 - CONFIGURACIÓN
 * =============================================================
 ***************************************************************/

const PRESET_COLORS = [

  '#ef4444',
  '#3b82f6',
  '#10b981',
  '#f59e0b',
  '#8b5cf6',
  '#ec4899',
  '#06b6d4',
  '#f97316',
  '#a855f7',
  '#14b8a6'

];


let map = null;

let googleHybrid = null;
let googleSatellite = null;
let googleStreets = null;
let googleTerrain = null;


let markersData = [];

let markerLayer = [];

let currentFile = null;

let currentFileType = null;

let currentSheetId = null;

let originalKML = null;

let routes = [];

let activeRouteId = null;

let routeMode = false;

let selectedColors = new Set();

let selectedDesc3 = new Set();

let colorCounter = 0;


/***************************************************************
 * =============================================================
 * 02 - INICIO
 * =============================================================
 ***************************************************************/

window.addEventListener(
  'load',
  initializeApp
);


function initializeApp() {

  initializeMap();

  refreshFiles();

}


/***************************************************************
 * =============================================================
 * 03 - MAPA
 * =============================================================
 ***************************************************************/

function initializeMap() {

  map = L.map('map')
    .setView(
      [19.4326, -99.1332],
      6
    );


  /*
   * GOOGLE HÍBRIDO
   *
   * NO API KEY
   */

  googleHybrid =
    L.tileLayer(
      'https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',
      {
        maxZoom: 20,
        attribution: '&copy; Google Maps'
      }
    );


  /*
   * GOOGLE SATÉLITE
   */

  googleSatellite =
    L.tileLayer(
      'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
      {
        maxZoom: 20,
        attribution: '&copy; Google Maps'
      }
    );


  /*
   * GOOGLE CALLES
   */

  googleStreets =
    L.tileLayer(
      'https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',
      {
        maxZoom: 20,
        attribution: '&copy; Google Maps'
      }
    );


  /*
   * GOOGLE TERRENO
   */

  googleTerrain =
    L.tileLayer(
      'https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}',
      {
        maxZoom: 20,
        attribution: '&copy; Google Maps'
      }
    );


  googleHybrid.addTo(map);


  L.control.layers({

    'Google Híbrido':
      googleHybrid,

    'Google Satélite':
      googleSatellite,

    'Google Calles':
      googleStreets,

    'Google Terreno':
      googleTerrain

  }).addTo(map);

}


/***************************************************************
 * =============================================================
 * 04 - PESTAÑAS
 * =============================================================
 ***************************************************************/

function switchTab(tab) {

  const tabs = [
    'data',
    'table',
    'filter',
    'route'
  ];


  tabs.forEach(function(t) {

    document
      .getElementById(
        'content-' + t
      )
      .classList.add('hidden');


    const button =
      document.getElementById(
        'tab-' + t
      );


    button.classList.remove(
      'border-blue-600',
      'text-blue-600'
    );

    button.classList.add(
      'border-transparent'
    );

  });


  document
    .getElementById(
      'content-' + tab
    )
    .classList.remove('hidden');


  const button =
    document.getElementById(
      'tab-' + tab
    );


  button.classList.remove(
    'border-transparent'
  );

  button.classList.add(
    'border-blue-600',
    'text-blue-600'
  );

}


/***************************************************************
 * =============================================================
 * 05 - SUBIR ARCHIVO
 * =============================================================
 ***************************************************************/

function handleUpload(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }


  const extension =
    file.name
      .split('.')
      .pop()
      .toLowerCase();


  showToast(
    'Procesando ' + file.name + '...'
  );


  if (
    extension === 'kml' ||
    extension === 'xml'
  ) {

    const reader =
      new FileReader();


    reader.onload =
      function(e) {

        const text =
          e.target.result;

        originalKML = text;

        processKML(
          file.name,
          text
        );

        saveKMLToDrive(
          file.name,
          text
        );

      };


    reader.readAsText(file);

    return;
  }


  if (
    extension === 'xlsx' ||
    extension === 'xls'
  ) {

    const reader =
      new FileReader();


    reader.onload =
      function(e) {

        try {

          const workbook =
            XLSX.read(
              new Uint8Array(
                e.target.result
              ),
              {
                type: 'array'
              }
            );


          const sheetName =
            workbook.SheetNames[0];


          const sheet =
            workbook.Sheets[
              sheetName
            ];


          const rows =
            XLSX.utils.sheet_to_json(
              sheet,
              {
                header: 1,
                defval: ''
              }
            );


          processExcel(
            file.name,
            rows
          );


          saveExcelToDrive(
            file,
            rows
          );


        } catch (error) {

          console.error(error);

          showToast(
            'Error al leer el Excel.'
          );

        }

      };


    reader.readAsArrayBuffer(file);

  }

}


/***************************************************************
 * =============================================================
 * 06 - KML
 * =============================================================
 */

function processKML(
  fileName,
  xmlText
) {

  const parser =
    new DOMParser();


  const xml =
    parser.parseFromString(
      xmlText,
      'text/xml'
    );


  const placemarks =
    xml.getElementsByTagName(
      'Placemark'
    );


  if (!placemarks.length) {

    showToast(
      'No se encontraron puntos.'
    );

    return;
  }


  const styleMap = {};


  const styles =
    xml.getElementsByTagName(
      'Style'
    );


  for (
    let i = 0;
    i < styles.length;
    i++
  ) {

    const style =
      styles[i];


    const id =
      style.getAttribute('id');


    const iconStyle =
      style.getElementsByTagName(
        'IconStyle'
      )[0];


    if (!iconStyle) {
      continue;
    }


    const color =
      iconStyle.getElementsByTagName(
        'color'
      )[0];


    if (color) {

      styleMap[id] =
        kmlColorToHex(
          color.textContent.trim()
        );

    }

  }


  clearMap();


  markersData = [];

  colorCounter = 0;


  for (
    let i = 0;
    i < placemarks.length;
    i++
  ) {

    const placemark =
      placemarks[i];


    const point =
      placemark.getElementsByTagName(
        'Point'
      )[0];


    if (!point) {
      continue;
    }


    const coordinates =
      point.getElementsByTagName(
        'coordinates'
      )[0];


    if (!coordinates) {
      continue;
    }


    const values =
      coordinates
        .textContent
        .trim()
        .split(',');


    const lng =
      parseFloat(values[0]);


    const lat =
      parseFloat(values[1]);


    if (
      isNaN(lat) ||
      isNaN(lng)
    ) {
      continue;
    }


    const nameNode =
      placemark.getElementsByTagName(
        'name'
      )[0];


    const name =
      nameNode
        ? nameNode.textContent.trim()
        : 'Punto ' + (i + 1);


    const descNode =
      placemark.getElementsByTagName(
        'description'
      )[0];


    const description =
      descNode
        ? descNode.textContent.trim()
        : '';


    const descriptions =
      splitDescription(
        description
      );


    let color =
      null;


    const styleUrl =
      placemark.getElementsByTagName(
        'styleUrl'
      )[0];


    if (styleUrl) {

      const id =
        styleUrl
          .textContent
          .trim()
          .replace('#', '');


      color =
        styleMap[id] ||
        null;

    }


    if (!color) {

      color =
        PRESET_COLORS[
          colorCounter %
          PRESET_COLORS.length
        ];

      colorCounter++;

    }


    const pointData = {

      id:
        'kml_' +
        Date.now() +
        '_' +
        i,

      row:
        i + 1,

      orden:
        i + 1,

      nombre:
        name,

      latitud:
        lat,

      longitud:
        lng,

      desc1:
        descriptions[0] || '',

      desc2:
        descriptions[1] || '',

      desc3:
        descriptions[2] || '',

      desc4:
        descriptions[3] || '',

      color:
        color,

      originalDescription:
        description,

      marker:
        null

    };


    markersData.push(
      pointData
    );

  }


  currentFile =
    fileName;

  currentFileType =
    'kml';

  currentSheetId =
    null;


  drawMarkers();

  refreshInterface();

  zoomAll();


  showToast(
    markersData.length +
    ' puntos cargados.'
  );

}


/***************************************************************
 * =============================================================
 * 07 - EXCEL
 * =============================================================
 */

function processExcel(
  fileName,
  rows
) {

  if (
    !rows ||
    rows.length === 0
  ) {

    showToast(
      'El Excel está vacío.'
    );

    return;
  }


  clearMap();


  markersData = [];


  /*
   * La primera fila se considera encabezado.
   */

  const headers =
    rows[0].map(function(h) {

      return String(
        h || ''
      )
        .trim()
        .toLowerCase();

    });


  for (
    let i = 1;
    i < rows.length;
    i++
  ) {

    const row =
      rows[i];


    if (
      !row ||
      row.every(
        v =>
          String(v || '').trim() === ''
      )
    ) {
      continue;
    }


    const orden =
      row[0] ?? '';


    const nombre =
      row[1] ?? '';


    const lat =
      parseFloat(
        row[2]
      );


    const lng =
      parseFloat(
        row[3]
      );


    if (
      isNaN(lat) ||
      isNaN(lng)
    ) {
      continue;
    }


    const point = {

      id:
        'excel_' +
        Date.now() +
        '_' +
        i,

      row:
        i + 1,

      orden:
        orden,

      nombre:
        nombre,

      latitud:
        lat,

      longitud:
        lng,

      desc1:
        row[4] ?? '',

      desc2:
        row[5] ?? '',

      desc3:
        row[6] ?? '',

      desc4:
        row[7] ?? '',

      color:
        getColorForDesc3(
          String(
            row[6] ?? ''
          )
        ),

      marker:
        null

    };


    markersData.push(
      point
    );

  }


  currentFile =
    fileName;

  currentFileType =
    'excel';


  drawMarkers();

  refreshInterface();

  zoomAll();


  document
    .getElementById(
      'export-box'
    )
    .classList.remove('hidden');


  showToast(
    markersData.length +
    ' registros cargados.'
  );

}


/***************************************************************
 * =============================================================
 * 08 - GUARDAR EXCEL
 * =============================================================
 */

function saveExcelToDrive(
  file,
  rows
) {

  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      const base64 =
        e.target.result
          .split(',')[1];


      document
        .getElementById(
          'drive-status'
        )
        .textContent =
          'Guardando Excel en Drive...';


      google.script.run

        .withSuccessHandler(
          function(result) {

            currentSheetId =
              result.sheetId;


            currentFile =
              result.fileName;


            currentFileType =
              'excel';


            refreshFiles();


            showToast(
              'Excel guardado en Drive.'
            );


            document
              .getElementById(
                'drive-status'
              )
              .textContent =
                'Excel sincronizado ✓';

          }
        )

        .withFailureHandler(
          function(error) {

            console.error(error);

            showToast(
              'Error al guardar Excel.'
            );

            document
              .getElementById(
                'drive-status'
              )
              .textContent =
                'Error de Drive';

          }
        )

        .saveExcelFile({

          fileName:
            file.name,

          mimeType:
            file.type,

          base64:
            base64,

          rows:
            rows

        });

    };


  reader.readAsDataURL(file);

}


/***************************************************************
 * =============================================================
 * 09 - GUARDAR KML
 * =============================================================
 */

function saveKMLToDrive(
  fileName,
  content
) {

  google.script.run

    .withSuccessHandler(
      function() {

        refreshFiles();

        showToast(
          'KML guardado en Drive.'
        );

      }
    )

    .withFailureHandler(
      function(error) {

        console.error(error);

        showToast(

        );

    )

    .saveKMLFile({

      fileName:
        fileName,

      content:
        content

    });

}


/***************************************************************
 * =============================================================
 * 10 - MARCADORES
 * =============================================================
 */

function drawMarkers() {

  clearMap();


  const bounds = [];


  markersData.forEach(
    function(point) {

      const marker =
        createMarker(
          point
        );


      point.marker =
        marker;


      markerLayer.push(
        marker
      );


      bounds.push([
        point.latitud,
        point.longitud
      ]);

    }
  );


  if (bounds.length) {

    map.fitBounds(
      bounds,
      {
        padding: [40, 40]
      }
    );

  }

}


/**
 * Crea marcador Leaflet.
 */
function createMarker(
  point
) {

  const icon =
    createMarkerIcon(
      point
    );


  const marker =
    L.marker(
      [
        point.latitud,
        point.longitud
      ],
      {
        icon:
          icon
      }
    );


  marker.addTo(map);


  marker.on(
    'click',
    function() {

      if (
        routeMode &&
        activeRouteId
      ) {

        togglePointInRoute(
          point.id
        );

        return;
      }


      openPointEditor(
        point
      );

    }
  );


  return marker;

}


/**
 * Icono.
 */
function createMarkerIcon(
  point
) {

  let badge =
    '';


  const route =
    getActiveRoute();


  if (route) {

    const index =
      route.points.indexOf(
        point.id
      );


    if (index >= 0) {

      badge =
        '<span class="route-badge">' +
        (index + 1) +
        '</span>';

    }

  }


  const html =

    '<div class="custom-marker">' +

      '<div ' +
        'class="marker-pin" ' +
        'style="background:' +
        escapeHtml(
          point.color ||
          '#ef4444'
        ) +
        ';">' +
      '</div>' +

      badge +

    '</div>';


  return L.divIcon({

    className:
      '',

    html:
      html,

    iconSize:
      [34, 34],

    iconAnchor:
      [17, 30],

    popupAnchor:
      [0, -30]

  });

}

function savePointEdit(
  pointId
) {

  const point =
    markersData.find(
      p => p.id === pointId
    );


  if (!point) {
    return;
  }


  point.nombre =
    document.getElementById(
      'edit-name-' + pointId
    ).value;


  point.latitud =
    parseFloat(
      document.getElementById(
        'edit-lat-' + pointId
      ).value
    );


  point.longitud =
    parseFloat(
      document.getElementById(
        'edit-lng-' + pointId
      ).value
    );


  point.desc1 =
    document.getElementById(
      'edit-desc1-' + pointId
    ).value;


  point.desc2 =
    document.getElementById(
      'edit-desc2-' + pointId
    ).value;


  point.desc3 =
    document.getElementById(
      'edit-desc3-' + pointId
    ).value;


  point.desc4 =
    document.getElementById(
      'edit-desc4-' + pointId
    ).value;


  point.color =
    document.getElementById(
      'edit-color-' + pointId
    ).value;


  if (
    isNaN(point.latitud) ||
    isNaN(point.longitud)
  ) {

    showToast(
      'Coordenadas inválidas.'
    );

    return;
  }


  redrawPoint(
    point
  );


  refreshInterface();


  map.closePopup();


  /*
   * Si es Excel,
   * guardar automáticamente.
   */

  if (
    currentFileType === 'excel' &&
    currentSheetId
  ) {

    autoSaveExcelPoint(
      point
    );

  }


  showToast(
    'Punto actualizado.'
  );

}

) {

  const marker =
    createMarker(

  point.marker =
    marker;

}

/***************************************************************
 * =============================================================
 * 18 - CAMBIOS DESDE TABLA
 * =============================================================
 */

function changeTableValue(
  id,
  field,
  value
) {

  const point =
    markersData.find(
      p => p.id === id
    );


  if (!point) {
    return;
  }


  if (
    field === 'latitud' ||
    field === 'longitud'
  ) {

    point[field] =
      parseFloat(value);

  } else {

    point[field] =
      value;

  }


  /*
   * DESCRIPCIÓN 3
   *
   * Cambiar descripción 3
   * cambia automáticamente
   * el color asociado.
   */

  if (field === 'desc3') {

    point.color =
      getColorForDesc3(
        String(value)
      );

  }


  redrawPoint(
    point
  );


  if (
    currentFileType === 'excel' &&
    currentSheetId
  ) {

    autoSaveExcelPoint(
      point
    );

  }


  refreshInterface();

}


/**
 * Cambiar color desde tabla.
 */
function changeTableColor(
  id,
  color
) {

  const point =
    markersData.find(
      p => p.id === id
    );


  if (!point) {
    return;
  }


  point.color =
    color;


  redrawPoint(
    point
  );


  if (
    currentFileType === 'excel' &&
    currentSheetId
  ) {

    autoSaveExcelPoint(
      point
    );

  }


  refreshInterface();

}


/***************************************************************
 * =============================================================
 * 19 - COLOR SEGÚN DESCRIPCIÓN 3
 * =============================================================
 */

function getColorForDesc3(
  value
) {

  const key =
    String(value || '')
      .trim()
      .toLowerCase();


  if (!key) {

    return PRESET_COLORS[
      0
    ];

  }


  /*
   * Se guarda en localStorage
   * para mantener el color
   * durante la sesión del navegador.
   */

  const storageKey =
    'desc3_colors';


  let mapColors = {};


  try {

    mapColors =
      JSON.parse(
        localStorage.getItem(
          storageKey
        ) || '{}'
      );

  } catch (e) {

    mapColors = {};

  }


  if (
    mapColors[key]
  ) {

    return mapColors[key];

  }


  const color =
    PRESET_COLORS[
      Object.keys(mapColors).length %
      PRESET_COLORS.length
    ];


  mapColors[key] =
    color;


  localStorage.setItem(
    storageKey,
    JSON.stringify(
      mapColors
    )
  );


  return color;

/**
 * Aplica filtros.
 */
function applyFilters() {

  const search =
    document
      .getElementById(
        'general-search'
      )
      .value
      .toLowerCase()
      .trim();


  selectedColors =
    new Set(
      [
        ...document.querySelectorAll(
          '[data-color-filter]:checked'
        )
      ]
        .map(
          e => e.value
        )
    );


  selectedDesc3 =
    new Set(
      [
        ...document.querySelectorAll(
          '[data-desc3-filter]:checked'
        )
      ]
        .map(
          e => e.value
        )
    );


  let visible =
    0;


  markersData.forEach(
    function(point) {

      const text =
        [
          point.nombre,
          point.desc1,
          point.desc2,
          point.desc3,
          point.desc4
        ]
          .join(' ')
          .toLowerCase();


      const searchOk =
        !search ||
        text.includes(search);


      const colorOk =
        selectedColors.size === 0
          ? false
          : selectedColors.has(
              point.color
            );


      const descOk =
        selectedDesc3.size === 0
          ? false
          : selectedDesc3.has(
              String(
                point.desc3 || ''
              ).trim()
            );


      const visiblePoint =
        searchOk &&
        colorOk &&
        descOk;


      if (visiblePoint) {

        if (
          point.marker &&
          !map.hasLayer(
            point.marker
          )
        ) {

          point.marker.addTo(
            map
          );

        }

        visible++;

      } else {

        if (
          point.marker &&
          map.hasLayer(
            point.marker
          )
        ) {

          map.removeLayer(
            point.marker
          );

        }

      }

    }
  );


  document
    .getElementById(
      'filter-info'
    )
    .textContent =
      visible +
      ' puntos visibles';

}

  if (!name) {
    return;
  }


  const route = {

      Date.now(),

    name:
      name,

    points:
      []

  };


  routes.push(

  );


  activeRouteId =

  renderRoutes();


  switchTab(
    'route'
  );


  showToast(

  );

}


/**
 * Ruta activa.
 */
function getActiveRoute() {

  return routes.find(
    r =>
      r.id === activeRouteId
  );

}


/**
 * Seleccionar ruta.
 */
function selectRoute(
  id
) {

  activeRouteId =
    id || null;


  routeMode =
    false;


  updateRoutePanel();

  drawMarkers();

}


/**
 * Activar modo ruta.
 */
function toggleRouteMode() {

  if (!activeRouteId) {

    showToast(
      'Primero crea o selecciona una ruta.'
    );

    return;
  }


  routeMode =
    !routeMode;


  const button =
    document.getElementById(
      'route-mode-btn'
    );


  if (routeMode) {

    button.textContent =
      'ACTIVADO';

    button.classList.remove(
      'bg-slate-200'
    );

    button.classList.add(
      'bg-blue-600',
      'text-white'
    );

    );

  } else {

    button.textContent =
      'Desactivado';

    button.classList.remove(
      'bg-blue-600',
      'text-white'
    );

    button.classList.add(
      'bg-slate-200'
    );

  }

}


/**
 * Agregar/quitar punto.
 */
function togglePointInRoute(
  pointId
) {

  const route =
    getActiveRoute();


  if (!route) {
    return;
  }


  const index =
    route.points.indexOf(
      pointId
    );


  if (index >= 0) {

    /*
     * Si ya estaba seleccionado,
     * lo quitamos.
     */

    route.points.splice(
      index,
      1
    );

  } else {

    /*
     * Se agrega al final,
     * por lo que automáticamente
     * queda 1, 2, 3...
     */

    route.points.push(
      pointId
    );

  }


  updateRoutePanel();

  drawMarkers();

}


/**
 * Limpiar ruta.
 */
function clearRoute() {

  const route =
    getActiveRoute();


  if (!route) {
    return;
  }


  route.points =
    [];


  updateRoutePanel();

  drawMarkers();

}


/**
 * Eliminar ruta.
 */
function deleteRoute() {

  if (!activeRouteId) {
    return;
  }


  routes =
    routes.filter(
      r =>
        r.id !== activeRouteId
    );


  activeRouteId =
    routes.length
      ? routes[0].id
      : null;


  routeMode =
    false;


  renderRoutes();

  updateRoutePanel();

  drawMarkers();

}

/***************************************************************
 * =============================================================
 * 24 - DISTANCIA DE RUTA
 * =============================================================
 */

function calculateRouteDistance() {

  const route =
    getActiveRoute();


  if (
    !route ||
    route.points.length < 2
  ) {

    document
      .getElementById(
        'route-distance'
      )
      .textContent =
        '0 km';

    return;

  }


  let total =
    0;


  for (
    let i = 1;
    i < route.points.length;
    i++
  ) {

    const a =
      markersData.find(
        p =>
          p.id ===
          route.points[i - 1]
      );


    const b =
      markersData.find(
        p =>
          p.id ===
          route.points[i]
      );


    if (!a || !b) {
      continue;
    }


    total +=
      distanceKm(
        a.latitud,
        a.longitud,
        b.latitud,
        b.longitud
      );

  }


  document
    .getElementById(
      'route-distance'
    )
    .textContent =
      total.toFixed(2) +
      ' km';

}


/**
 * Haversine.
 */
function distanceKm(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371;


  const dLat =
    (lat2 - lat1) *
    Math.PI / 180;


  const dLon =
    (lon2 - lon1) *
    Math.PI / 180;


  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(
      lat1 * Math.PI / 180
    ) *
    Math.cos(
      lat2 * Math.PI / 180
    ) *
    Math.sin(dLon / 2) ** 2;


  return 2 *
    R *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

}


/***************************************************************
 * =============================================================
 * 25 - GOOGLE MAPS
 * =============================================================
 */

function openGoogleRoute() {

  const route =
    getActiveRoute();


  if (
    !route ||
    route.points.length < 2
  ) {

    showToast(
      'La ruta necesita al menos 2 puntos.'
    );

    return;

  }


  const points =
    route.points
      .map(
        id =>
          markersData.find(
            p =>
              p.id === id
          )
      )
      .filter(Boolean);


  const origin =
    points[0];


  const destination =
    points[
      points.length - 1
    ];


  const waypoints =
    points
      .slice(
        1,
        -1
      )
      .map(
        p =>
          p.latitud +
          ',' +
          p.longitud
      )
      .join('|');


  let url =
    'https://www.google.com/maps/dir/?api=1';


  url +=
    '&origin=' +
    encodeURIComponent(
      origin.latitud +
      ',' +
      origin.longitud
    );


  url +=
    '&destination=' +
    encodeURIComponent(
      destination.latitud +
      ',' +
      destination.longitud
    );


  if (waypoints) {

    url +=
      '&waypoints=' +
      encodeURIComponent(
        waypoints
      );

  }


  url +=
    '&travelmode=driving';


  window.open(
    url,
    '_blank'
  );

}


/***************************************************************
 * =============================================================
 * 26 - EXPORTAR KML
 * =============================================================
 */

function downloadKML() {

  if (
    !markersData.length
  ) {

    showToast(
      'No hay puntos para exportar.'
    );

    return;

  }


  const styles = {};

  let stylesXml =
    '';


  markersData.forEach(
    function(point, index) {

      const color =
        point.color ||
        '#ef4444';


      const styleId =
        'style_' +
        color
          .replace('#', '');


      if (
        !styles[styleId]
      ) {

        styles[styleId] =
          true;


        stylesXml += `

          <Style id="${styleId}">

            <IconStyle>

              <color>
                ${hexToKmlColor(color)}
              </color>

              <scale>1.1</scale>

              <Icon>

                <href>
                  http://maps.google.com/mapfiles/kml/pushpin/red-pushpin.png
                </href>

              </Icon>

            </IconStyle>

          </Style>

        `;

      }

    }
  );


  let placemarks =
    '';


  markersData.forEach(
    function(point, index) {

      const styleId =
        'style_' +
        (
          point.color ||
          '#ef4444'
        )
        .replace('#', '');


      const description =
        buildKMLDescription(
          point
        );


      placemarks += `

        <Placemark>

          <name>
            ${escapeXml(point.nombre)}
          </name>

          <styleUrl>
            #${styleId}
          </styleUrl>

          <description>
            <![CDATA[
              ${description}
            ]]>
          </description>

          <Point>

            <coordinates>
              ${point.longitud},${point.latitud},0
            </coordinates>

          </Point>

        </Placemark>

      `;

    }
  );


  /*
   * Agregar rutas
   */

  routes.forEach(
    function(route) {

      if (
        route.points.length < 2
      ) {
        return;
      }


      const coordinates =
        route.points
          .map(
            id =>
              markersData.find(
                p =>
                  p.id === id
              )
          )
          .filter(Boolean)
          .map(
            p =>
              p.longitud +
              ',' +
              p.latitud +
              ',0'
          )
          .join(' ');


      placemarks += `

        <Placemark>

          <name>
            ${escapeXml(route.name)}
          </name>

          <Style>

            <LineStyle>

              <color>
                ff2563eb
              </color>

              <width>
                5
              </width>

            </LineStyle>

          </Style>

          <LineString>

            <tessellate>
              1
            </tessellate>

            <coordinates>
              ${coordinates}
            </coordinates>

          </LineString>

        </Placemark>

      `;

    }
  );


  const kml = `

<?xml version="1.0" encoding="UTF-8"?>

<kml
  xmlns="http://www.opengis.net/kml/2.2"
>

<Document>

  <name>
    Visualizador actualizado
  </name>

  ${stylesXml}

  ${placemarks}

</Document>

</kml>

`;


  const blob =
    new Blob(
      [kml],
      {
        type:
          'application/vnd.google-earth.kml+xml'
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      'a'
    );


  a.href =
    url;


  a.download =
    getExportName(
      currentFile ||
      'mapa'
    ) +
    '.kml';


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  URL.revokeObjectURL(
    url
  );


  showToast(
    'KML generado.'
  );

}

/***************************************************************
 * =============================================================
 * 30 - DESCRIPCIONES KML
 * =============================================================
 */

function splitDescription(
  description
) {

  if (!description) {
    return [];
  }


  /*
   * Primero eliminar etiquetas HTML.
   */

  let text =
    description
      .replace(
        /<br\s*\/?>/gi,
        '\n'
      )
      .replace(
        /<\/p>/gi,
        '\n'
      )
      .replace(
        /<[^>]*>/g,
        ''
      );


  text =
    decodeHtml(
      text
    );


  /*
   * Detectar separador.
   */

  let parts;


  if (
    text.includes('\n')
  ) {

    parts =
      text
        .split(/\n+/);

  } else if (
    text.includes('|')
  ) {

    parts =
      text.split('|');

  } else if (
    text.includes(';')
  ) {

    parts =
      text.split(';');

  } else {

    parts =
      [text];

  }


  return parts
    .map(
      p =>
        p.trim()
    )
    .filter(
      p =>
        p !== ''
    );

}


/***************************************************************
 * =============================================================
 * 31 - DESCRIPCIÓN KML
 * =============================================================
 */

function buildKMLDescription(
  point
) {

  const parts = [

    point.desc1,
    point.desc2,
    point.desc3,
    point.desc4

  ]
    .map(
      p =>
        String(
          p || ''
        ).trim()
    )
    .filter(Boolean);


  /*
   * Utilizamos <br>
   * para conservar las diferentes
   * secciones.
   */

  return parts
    .map(
      escapeXml
    )
    .join(
      '<br>'
    );

}


/***************************************************************
 * =============================================================
 * 32 - COLORES KML
 * =============================================================
 */

/*
 * KML:
 *
 * AABBGGRR
 *
 * Ejemplo:
 *
 * ff0000ff = rojo
 */

function kmlColorToHex(
  value
) {

  let color =
    value
      .replace('#', '')
      .trim();


  if (
    color.length === 8
  ) {

    const rr =
      color.substring(
        6,
        8
      );


    const gg =
      color.substring(
        4,
        6
      );


    const bb =
      color.substring(
        2,
        4
      );


    return '#' +
      rr +
      gg +
      bb;

  }


  if (
    color.length === 6
  ) {

    return '#' +
      color;

  }


  return '#ef4444';

}


/**
 * HEX -> KML
 */
function hexToKmlColor(
  hex
) {

  let value =
    hex
      .replace('#', '');


  if (
    value.length !== 6
  ) {

    value =
      'ef4444';

  }


  const rr =
    value.substring(
      0,
      2
    );


  const gg =
    value.substring(
      2,
      4
    );


  const bb =
    value.substring(
      4,
      6
    );


  /*
   * ff = opacidad
   * + BB + GG + RR
   */

  return 'ff' +
    bb +
    gg +
    rr;

}


/***************************************************************
 * =============================================================
 * 33 - UTILIDADES
 * =============================================================
 */

function escapeHtml(
  value
) {

  return String(
    value ?? ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


function escapeXml(
  value
) {

  return String(
    value ?? ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&apos;'
    );

}


function decodeHtml(
  value
) {

  const textarea =
    document.createElement(
      'textarea'
    );


  textarea.innerHTML =
    value;


  return textarea.value;

}


function getExportName(
  name
) {

  return String(
    name || 'mapa'
  )
    .replace(
      /\.[^.]+$/,
      ''
    )
    .replace(
      /[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ_-]+/g,
      '_'
    );

}


function getSelectedFileId() {

  return document
    .getElementById(
      'file-select'
    )
    .value;

}


/***************************************************************
 * =============================================================
 * 34 - TOAST
 * =============================================================
 */

let toastTimer = null;


function showToast(
  message
) {

  const toast =
    document.getElementById(
      'toast'
    );


  const text =
    document.getElementById(
      'toast-text'
    );


  text.textContent =
    message;


  toast.classList.add(
    'show'
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      function() {

        toast.classList.remove(
          'show'
        );

      },
      2800
    );

}


</script>
