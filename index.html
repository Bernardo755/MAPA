<script>


/***************************************************************

let map;

let googleHybrid;

let googleStreets;

let markersData = [];

let currentFile = '';

let currentSheetId = '';

let originalKML = '';


let routes = [];

/*

 * Un Set vacío significa:
 * "no aplicar filtro para ese campo".

/***************************************************************

window.addEventListener(

);


function initializeApp() {

  initializeMap();

  refreshFiles();

}


/***************************************************************
 * =============================================================
 * MÓDULO 11 - MAPA
 * =============================================================
 ***************************************************************/


function initializeMap() {

  map =
    L.map(
      'map'
    )
    .setView(
      [19.4326, -99.1332],
      6
    );


  googleHybrid =
    L.tileLayer(
      'https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',
      {
        maxZoom: 20,
        attribution:
          '&copy; Google Maps'
      }
    );


  googleSatellite =
    L.tileLayer(
      'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
      {
        maxZoom: 20,
        attribution:
          '&copy; Google Maps'
      }
    );


  googleStreets =
    L.tileLayer(
      'https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',
      {
        maxZoom: 20,
        attribution:
          '&copy; Google Maps'
      }
    );


  googleTerrain =
    L.tileLayer(
      'https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}',
      {
        maxZoom: 20,
        attribution:
          '&copy; Google Maps'
      }
    );


  googleHybrid.addTo(
    map
  );


  L.control.layers({

    'Google Híbrido':
      googleHybrid,

    'Google Satélite':
      googleSatellite,

    'Google Calles':
      googleStreets,

    'Google Terreno':
      googleTerrain

  }).addTo(
    map
  );

}


/***************************************************************
 * =============================================================
 * MÓDULO 12 - PESTAÑAS
 * =============================================================
 ***************************************************************/


function switchTab(
  tab
) {

  const tabs = [
    'data',
    'table',
    'filter',
    'route'
  ];


  tabs.forEach(
    function(item) {

      document
        .getElementById(
          'content-' +
          item
        )
        .classList
        .add(
          'hidden'
        );


      const button =
        document.getElementById(
          'tab-' +
          item
        );


      button.classList
        .remove(
          'border-blue-600',
          'text-blue-600'
        );


      button.classList
        .add(
          'border-transparent'
        );

    }
  );


  document
    .getElementById(
      'content-' +
      tab
    )
    .classList
    .remove(
      'hidden'
    );


  const button =
    document.getElementById(
      'tab-' +
      tab
    );


  button.classList
    .remove(
      'border-transparent'
    );


  button.classList
    .add(
      'border-blue-600',
      'text-blue-600'
    );

}

  event
) {

  const file =
    event.target.files[0];


  if (!file) {
    return;
  }


  const extension =
    file.name
      .split('.')
      .pop()
      .toLowerCase();


  showToast(
    'Procesando archivo...'
  );


  if (
    extension === 'kml' ||
    extension === 'xml'
  ) {

    const reader =
      new FileReader();


    reader.onload =
      function(e) {

        const content =
          e.target.result;


        originalKML =
          content;


        processKML(
          file.name,
          content
        );


        google.script.run

          .withSuccessHandler(
            function() {

              refreshFiles();

              showToast(
                'KML guardado en Drive.'
              );

            }
          )

          .withFailureHandler(
            function(error) {

              console.error(
                error
              );

              showToast(
                'Error al guardar KML.'
              );

            }
          )

          .saveKMLFile({

            fileName:
              file.name,

            content:
              content

          });

      };


    reader.readAsText(
      file
    );

    return;

  }


  if (
    extension === 'xlsx' ||
    extension === 'xls'
  ) {

    const reader =
      new FileReader();


    reader.onload =
      function(e) {

        try {

          const workbook =
            XLSX.read(
              new Uint8Array(
                e.target.result
              ),
              {
                type:
                  'array'
              }
            );


          const sheet =
            workbook.Sheets[
              workbook.SheetNames[0]
            ];


          const rows =
            XLSX.utils.sheet_to_json(
              sheet,
              {
                header:
                  1,

                defval:
                  ''
              }
            );


          processExcel(
            file.name,
            rows
          );


          saveExcelToDrive(
            file,
            rows
          );


        } catch (error) {

          console.error(
            error
          );

          showToast(
            'Error al leer Excel.'
          );

        }

      };


    reader.readAsArrayBuffer(
      file
    );

  }

}


/***************************************************************
 * =============================================================
 * MÓDULO 14 - PROCESAR EXCEL
 * =============================================================
 ***************************************************************/


function processExcel(
  fileName,
  rows
) {

  if (
    !rows ||
    rows.length < 2
  ) {

    showToast(
      'El Excel no contiene registros.'
    );

    return;

  }


  clearMap();

  markersData = [];


  let order = 1;


  for (
    let i = 1;
    i < rows.length;
    i++
  ) {

    const row =
      rows[i];


    if (
      !row ||
      row.every(
        value =>
          String(
            value || ''
          ).trim() === ''
      )
    ) {

      continue;

    }


    const nombre =
      String(
        row[0] ?? ''
      ).trim();


    const latitud =
      parseFloat(
        String(
          row[1] ?? ''
        )
          .replace(
            ',',
            '.'
          )
      );


    const longitud =
      parseFloat(
        String(
          row[2] ?? ''
        )
          .replace(
            ',',
            '.'
          )
      );


    if (
      isNaN(latitud) ||
      isNaN(longitud)
    ) {

      continue;

    }


    const desc1 =
      String(
        row[3] ?? ''
      ).trim();


    const desc2 =
      String(
        row[4] ?? ''
      ).trim();


    const desc3 =
      String(
        row[5] ?? ''
      ).trim();


    const color =
      normalizeColor(
        row[6]
      );


    markersData.push({

      id:
        'excel_' +
        Date.now() +
        '_' +
        i,

      row:
        i + 1,

      orden:
        order,

      nombre:
        nombre,

      latitud:
        latitud,

      longitud:
        longitud,

      desc1:
        desc1,

      desc2:
        desc2,

      desc3:
        desc3,

      color:
        color,

      marker:
        null

    });


    order++;

  }


  currentFile =
    fileName;

  currentFileType =
    'excel';


  drawMarkers();

  refreshInterface();

  zoomAll();


  document
    .getElementById(
      'export-box'
    )
    .classList
    .remove(
      'hidden'
    );


  showToast(
    markersData.length +
    ' puntos cargados.'
  );

}


/***************************************************************
 * =============================================================
 * MÓDULO 15 - COLORES
 * =============================================================
 ***************************************************************/


function normalizeColor(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return DEFAULT_COLORS[0];

  }


  let color =
    String(
      value
    )
      .trim()
      .toLowerCase();


  if (!color) {

    return DEFAULT_COLORS[0];

  }


  if (
    /^#[0-9a-f]{6}$/i.test(
      color
    )
  ) {

    return color;

  }


  if (
    /^[0-9a-f]{6}$/i.test(
      color
    )
  ) {

    return '#' +
      color;

  }


  const rgb =
    color.match(
      /^rgb\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i
    );


  if (rgb) {

    return rgbToHex(
      Number(rgb[1]),
      Number(rgb[2]),
      Number(rgb[3])
    );

  }


  const namedColors = {

    rojo:
      '#FF0000',

    red:
      '#FF0000',

    verde:
      '#00A000',

    green:
      '#008000',

    azul:
      '#0000FF',

    blue:
      '#0000FF',

    amarillo:
      '#FFFF00',

    yellow:
      '#FFFF00',

    naranja:
      '#FFA500',

    orange:
      '#FFA500',

    morado:
      '#800080',

    purple:
      '#800080',

    rosa:
      '#FF69B4',

    pink:
      '#FFC0CB',

    negro:
      '#000000',

    black:
      '#000000',

    blanco:
      '#FFFFFF',

    white:
      '#FFFFFF',

    gris:
      '#808080',

    gray:
      '#808080',

    cyan:
      '#00FFFF',

    turquesa:
      '#40E0D0',

    cafe:
      '#8B4513',

    marron:
      '#8B4513',

    dorado:
      '#FFD700',

    oro:
      '#FFD700',

    plata:
      '#C0C0C0',

    vino:
      '#800000',

    verdeoscuro:
      '#006400',

    verdeclaro:
      '#90EE90',

    azuloscuro:
      '#00008B',

    azulclaro:
      '#87CEEB',

    moradooscuro:
      '#4B0082',

    lila:
      '#C8A2C8',

    beige:
      '#F5F5DC',

    oliva:
      '#808000'

  };


  if (
    namedColors[color]
  ) {

    return namedColors[color];

  }


  return getAutomaticColor();

}


function getAutomaticColor() {

  const color =
    DEFAULT_COLORS[
      automaticColorIndex %
      DEFAULT_COLORS.length
    ];


  automaticColorIndex++;


  return color;

}


function rgbToHex(
  r,
  g,
  b
) {

  return '#' +

    [r, g, b]
      .map(
        function(value) {

          return Math
            .max(
              0,
              Math.min(
                255,
                value
              )
            )
            .toString(16)
            .padStart(
              2,
              '0'
            );

        }
      )
      .join('');

}


/***************************************************************
 * =============================================================
 * MÓDULO 16 - GUARDAR EXCEL EN DRIVE
 * =============================================================
 ***************************************************************/


function saveExcelToDrive(
  file,
  rows
) {

  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      const base64 =
        e.target.result
          .split(',')[1];


      document
        .getElementById(
          'drive-status'
        )
        .textContent =
          'Guardando Excel en Drive...';


      google.script.run

        .withSuccessHandler(
          function(result) {

            currentFileId =
              result.fileId;


            currentSheetId =
              result.sheetId;


            currentFile =
              result.fileName;


            currentFileType =
              'excel';


            document
              .getElementById(
                'drive-status'
              )
              .textContent =
                'Excel guardado en Drive ✓';


            refreshFiles();


            showToast(
              'Excel guardado en Drive.'
            );

          }
        )

        .withFailureHandler(
          function(error) {

            console.error(
              error
            );


            document
              .getElementById(
                'drive-status'
              )
              .textContent =
                'Error al guardar';


            showToast(
              'Error al guardar Excel.'
            );

          }
        )

        .saveExcelFile({

          fileName:
            file.name,

          mimeType:
            file.type,

          base64:
            base64,

          rows:
            rows

        });

    };


  reader.readAsDataURL(
    file
  );

}


/***************************************************************
 * =============================================================
 * MÓDULO 17 - MAPA
 * =============================================================
 ***************************************************************/


function drawMarkers() {

  clearMap();


  markersData.forEach(
    function(point) {

      const marker =
        createMarker(
          point
        );


      point.marker =
        marker;


      markerLayer.push(
        marker
      );

    }
  );

}


function createMarker(
  point
) {

  const marker =
    L.marker(

      [
        point.latitud,
        point.longitud
      ],

      {

        icon:
          createMarkerIcon(
            point
          )

      }

    );


  marker.addTo(
    map
  );


  marker.on(
    'click',
    function() {

      if (
        routeMode &&
        activeRouteId
      ) {

        togglePointInRoute(
          point.id
        );

        return;

      }


      openPointEditor(
        point
      );

    }
  );


  return marker;

}


function createMarkerIcon(
  point
) {

  let badge =
    '';


  const route =
    getActiveRoute();


  if (route) {

    const index =
      route.points.indexOf(
        point.id
      );


    if (
      index >= 0
    ) {

      badge =
        '<span class="route-badge">' +
        (index + 1) +
        '</span>';

    }

  }


  return L.divIcon({

    className:
      '',

    html:

      '<div class="custom-marker">' +

        '<div ' +
        'class="marker-pin" ' +
        'style="background:' +
        escapeHtml(
          point.color
        ) +
        ';">' +
        '</div>' +

        badge +

      '</div>',

    iconSize:
      [36, 36],

    iconAnchor:
      [18, 32]

  });

}

/***************************************************************
 * =============================================================
 * MÓDULO 19 - GUARDADO AUTOMÁTICO
 * =============================================================
 ***************************************************************/


function savePointEdit(
  id
) {

  const point =
    markersData.find(
      p =>
        p.id === id
    );


  if (!point) {
    return;
  }


  /*
   * IMPORTANTE:
   *
   * NO se leen ni modifican:
   * nombre
   * latitud
   * longitud
   *
   * porque son campos protegidos.
   */


  point.desc1 =
    document
      .getElementById(
        'edit-d1-' + id
      )
      .value;


  point.desc2 =
    document
      .getElementById(
        'edit-d2-' + id
      )
      .value;


  point.desc3 =
    document
      .getElementById(
        'edit-d3-' + id
      )
      .value;


  point.color =
    document
      .getElementById(
        'edit-color-' + id
      )
      .value;


  redrawPoint(
    point
  );


  if (
    currentFileType === 'excel' &&
    currentSheetId
  ) {

    autoSaveExcelPoint(
      point
    );

  }


  refreshInterface();


  map.closePopup();


  showToast(
    'Punto actualizado.'
  );

}


/***************************************************************
 * =============================================================
 * MÓDULO 20 - GUARDADO AUTOMÁTICO
 * =============================================================
 ***************************************************************/


function autoSaveExcelPoint(
  point
) {

  google.script.run

    .withSuccessHandler(
      function() {

        document
          .getElementById(
            'drive-status'
          )
          .textContent =
            'Cambio guardado ✓';

      }
    )

    .withFailureHandler(
      function(error) {

        console.error(
          error
        );

        showToast(
          'Error al guardar cambio.'
        );

      }
    )

    .updateExcelRow({

      sheetId:
        currentSheetId,

      rowNumber:
        point.row,

      values: [

        point.nombre,
        point.latitud,
        point.longitud,
        point.desc1,
        point.desc2,
        point.desc3,
        point.color

      ]

    });

}


/***************************************************************
 * =============================================================
 * MÓDULO 21 - TABLA
 * =============================================================
 *
 * Nombre, Latitud y Longitud NO son editables.
 *
 * El nombre es clickeable.
 * =============================================================
 ***************************************************************/


function renderTable() {

  const tbody =
    document.getElementById(
      'table-body'
    );


  tbody.innerHTML =
    '';


  const search =
    document
      .getElementById(
        'table-search'
      )
      .value
      .toLowerCase();


  markersData.forEach(
    function(point) {

      const text =
        [
          point.nombre,
          point.desc1,
          point.desc2,
          point.desc3
        ]
          .join(' ')
          .toLowerCase();


      if (
        search &&
        !text.includes(
          search
        )
      ) {

        return;

      }


      const tr =
        document.createElement(
          'tr'
        );


      tr.className =
        'border-b';


      tr.innerHTML = `

        <td class="p-1 text-center">
          ${point.orden}
        </td>


        <!-- NOMBRE PROTEGIDO Y CLICKEABLE -->

        <td class="p-1">

          <div
            class="table-point-name p-1"
            title="Ir al punto en el mapa"
            onclick="focusPoint('${point.id}')"
          >
            ${escapeHtml(point.nombre)}
          </div>

        </td>


        <!-- LATITUD PROTEGIDA -->

        <td class="p-1 text-center">

          <div class="readonly-field">
            ${point.latitud}
          </div>

        </td>


        <!-- LONGITUD PROTEGIDA -->

        <td class="p-1 text-center">

          <div class="readonly-field">
            ${point.longitud}
          </div>

        </td>


        <!-- DESCRIPCIÓN 1 EDITABLE -->

        <td class="p-1">

          <input
            class="edit-input"
            value="${escapeHtml(point.desc1)}"
            onchange="changeTableValue('${point.id}','desc1',this.value)"
          >

        </td>


        <!-- DESCRIPCIÓN 2 EDITABLE -->

        <td class="p-1">

          <input
            class="edit-input"
            value="${escapeHtml(point.desc2)}"
            onchange="changeTableValue('${point.id}','desc2',this.value)"
          >

        </td>


        <!-- DESCRIPCIÓN 3 EDITABLE -->

        <td class="p-1">

          <input
            class="edit-input"
            value="${escapeHtml(point.desc3)}"
            onchange="changeTableValue('${point.id}','desc3',this.value)"
          >

        </td>


        <!-- COLOR EDITABLE -->

        <td class="p-1">

          <input
            type="color"
            value="${point.color}"
            onchange="changeTableColor('${point.id}',this.value)"
          >

        </td>

      `;


      tbody.appendChild(
        tr
      );

    }
  );

}


/***************************************************************
 * =============================================================
 * MÓDULO 22 - CAMBIOS TABLA
 * =============================================================
 ***************************************************************/


function changeTableValue(
  id,
  field,
  value
) {

  /*
   * SEGURIDAD:
   *
   * No permitir modificar
   * nombre, latitud ni longitud.
   */

  if (
    field === 'nombre' ||
    field === 'latitud' ||
    field === 'longitud'
  ) {

    renderTable();

    return;

  }


  const point =
    markersData.find(
      p =>
        p.id === id
    );


  if (!point) {
    return;
  }


  point[field] =
    value;


  redrawPoint(
    point
  );


  if (
    currentFileType === 'excel' &&
    currentSheetId
  ) {

    autoSaveExcelPoint(
      point
    );

  }


  /*
   * Si se modificó una descripción,
   * reconstruimos los filtros.
   */

  if (
    field === 'desc1' ||
    field === 'desc2' ||
    field === 'desc3'
  ) {

    buildDescriptionFilters();

  }

}


function changeTableColor(
  id,
  color
) {

  const point =
    markersData.find(
      p =>
        p.id === id
    );


  if (!point) {
    return;
  }


  point.color =
    color;


  redrawPoint(
    point
  );


  if (
    currentFileType === 'excel' &&
    currentSheetId
  ) {

    autoSaveExcelPoint(
      point
    );

  }


  buildFilters();

}


/***************************************************************
 * =============================================================
 * MÓDULO 23 - FILTROS POR COLOR
 * =============================================================
 ***************************************************************/


function buildFilters() {

  buildColorFilters();

  buildDescriptionFilters();

}


/***************************************************************
 * =============================================================
 * MÓDULO 24 - CONSTRUIR FILTROS DE COLOR
 * =============================================================
 ***************************************************************/


function buildColorFilters() {

  const colors =
    [
      ...new Set(
        markersData.map(
          p =>
            p.color
        )
      )
    ];


  selectedColors =
    new Set(
      colors
    );


  const box =
    document.getElementById(
      'color-filters'
    );


  box.innerHTML =
    '';


  colors.forEach(
    function(color) {

      box.innerHTML += `

        <label
          class="
            filter-option
          "
        >

          <input
            type="checkbox"
            checked
            value="${escapeHtml(color)}"
            data-color-filter
            onchange="applyFilters()"
          >


          <span
            style="
              width:16px;
              height:16px;
              display:inline-block;
              border-radius:50%;
              background:${escapeHtml(color)};
              border:1px solid #999;
              flex-shrink:0;
            "
          ></span>


          <span
            class="filter-option-text"
          >
            ${escapeHtml(color)}
          </span>

        </label>

      `;

    }
  );

}


/***************************************************************
 * =============================================================
 * MÓDULO 25 - FILTROS DE DESCRIPCIONES
 * =============================================================
 ***************************************************************/


function buildDescriptionFilters() {

  const fields = [

    {
      field:
        'desc1',

      container:
        'desc1-filters'
    },

    {
      field:
        'desc2',

      container:
        'desc2-filters'
    },

    {
      field:
        'desc3',

      container:
        'desc3-filters'
    }

  ];


  fields.forEach(
    function(config) {

      const values =
        [
          ...new Set(

            markersData
              .map(
                p =>
                  String(
                    p[
                      config.field
                    ] ??
                    ''
                  ).trim()
              )
              .filter(
                value =>
                  value !== ''
              )

          )
        ]
          .sort(
            function(a, b) {

              return a.localeCompare(
                b,
                'es',
                {
                  sensitivity:
                    'base'
                }
              );

            }
          );


      const box =
        document.getElementById(
          config.container
        );


      box.innerHTML =
        '';


      /*
       * Si no existen valores.
       */

      if (
        !values.length
      ) {

        box.innerHTML = `

          <div
            class="
              text-[11px]
              text-slate-400
              p-1
            "
          >
            Sin valores disponibles
          </div>

        `;


        selectedDescriptionFilters[
          config.field
        ] =
          new Set();


        return;

      }


      /*
       * Al reconstruir los filtros,
       * todos los valores quedan seleccionados.
       */

      selectedDescriptionFilters[
        config.field
      ] =
        new Set(
          values
        );


      values.forEach(
        function(value) {

          box.innerHTML += `

            <label
              class="filter-option"
            >

              <input
                type="checkbox"
                checked
                data-description-filter="${config.field}"
                value="${escapeHtml(value)}"
                onchange="applyFilters()"
              >

              <span
                class="filter-option-text"
                title="${escapeHtml(value)}"
              >
                ${escapeHtml(value)}
              </span>

            </label>

          `;

        }
      );

    }
  );

}


/***************************************************************
 * =============================================================
 * MÓDULO 26 - APLICAR FILTROS
 * =============================================================
 ***************************************************************/


function applyFilters() {

  const search =
    document
      .getElementById(
        'general-search'
      )
      .value
      .toLowerCase()
      .trim();


  /*
   * COLOR
   */

  selectedColors =
    new Set(

      [
        ...document
          .querySelectorAll(
            '[data-color-filter]:checked'
          )
      ]
        .map(
          e =>
            e.value
        )

    );


  /*
   * DESCRIPCIONES
   */

  selectedDescriptionFilters =
    {

      desc1:
        getSelectedDescriptionValues(
          'desc1'
        ),

      desc2:
        getSelectedDescriptionValues(
          'desc2'
        ),

      desc3:
        getSelectedDescriptionValues(
          'desc3'
        )

    };


  let visible =
    0;


  markersData.forEach(
    function(point) {

      const text =
        [
          point.nombre,
          point.desc1,
          point.desc2,
          point.desc3
        ]
          .join(' ')
          .toLowerCase();


      /*
       * FILTRO DE BÚSQUEDA
       */

      const matchSearch =
        (
          !search ||
          text.includes(
            search
          )
        );


      /*
       * FILTRO COLOR
       */

      const matchColor =
        selectedColors.has(
          point.color
        );


      /*
       * FILTRO DESCRIPCIÓN 1
       */

      const matchDesc1 =
        matchesDescriptionFilter(
          point.desc1,
          selectedDescriptionFilters.desc1
        );


      /*
       * FILTRO DESCRIPCIÓN 2
       */

      const matchDesc2 =
        matchesDescriptionFilter(
          point.desc2,
          selectedDescriptionFilters.desc2
        );


      /*
       * FILTRO DESCRIPCIÓN 3
       */

      const matchDesc3 =
        matchesDescriptionFilter(
          point.desc3,
          selectedDescriptionFilters.desc3
        );


      /*
       * TODOS LOS FILTROS
       *
       * AND entre grupos.
       */

      const visiblePoint =
        matchSearch &&
        matchColor &&
        matchDesc1 &&
        matchDesc2 &&
        matchDesc3;


      if (
        visiblePoint
      ) {

        if (
          point.marker &&
          !map.hasLayer(
            point.marker
          )
        ) {

          point.marker.addTo(
            map
          );

        }


        visible++;

      } else {

        if (
          point.marker &&
          map.hasLayer(
            point.marker
          )
        ) {

          map.removeLayer(
            point.marker
          );

        }

      }

    }
  );


  document
    .getElementById(
      'filter-info'
    )
    .textContent =
      visible +
      ' puntos visibles';

}


/***************************************************************
 * =============================================================
 * OBTENER VALORES SELECCIONADOS
 * =============================================================
 ***************************************************************/


function getSelectedDescriptionValues(
  field
) {

  return new Set(

    [
      ...
      document.querySelectorAll(
        '[data-description-filter="' +
        field +
        '"]:checked'
      )
    ]
      .map(
        element =>
          element.value
      )

  );

}


/***************************************************************
 * =============================================================
 * COMPROBAR FILTRO DE DESCRIPCIÓN
 * =============================================================
 ***************************************************************/


function matchesDescriptionFilter(
  value,
  selectedValues
) {

  /*
   * Si no hay nada seleccionado,
   * ese filtro no restringe.
   */

  if (
    !selectedValues ||
    selectedValues.size === 0
  ) {

    return true;

  }


  const normalizedValue =
    String(
      value ??
      ''
    )
      .trim();


  return selectedValues.has(
    normalizedValue
  );

}


/***************************************************************
 * =============================================================
 * SELECCIONAR TODOS LOS VALORES
 * =============================================================
 ***************************************************************/


function selectAllDescriptionValues(
  field,
  value
) {

  document
    .querySelectorAll(
      '[data-description-filter="' +
      field +
      '"]'
    )
    .forEach(
      function(check) {

        check.checked =
          value;

}

/***************************************************************
 * =============================================================
 * MÓDULO 28 - DISTANCIA
 * =============================================================
 ***************************************************************/


function calculateRouteDistance() {

  const route =
    getActiveRoute();


  if (
    !route ||
    route.points.length < 2
  ) {

    document
      .getElementById(
        'route-distance'
      )
      .textContent =
        '0 km';

    return;

  }


  let total =
    0;


  for (
    let i = 1;
    i < route.points.length;
    i++
  ) {

    const a =
      markersData.find(
        p =>
          p.id ===
          route.points[
            i - 1
          ]
      );


    const b =
      markersData.find(
        p =>
          p.id ===
          route.points[i]
      );


    if (
      !a ||
      !b
    ) {
      continue;
    }


    total +=
      distanceKm(
        a.latitud,
        a.longitud,
        b.latitud,
        b.longitud
      );

  }


  document
    .getElementById(
      'route-distance'
    )
    .textContent =
      total.toFixed(2) +
      ' km';

}


function distanceKm(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371;


  const dLat =
    (
      lat2 -
      lat1
    ) *
    Math.PI /
    180;


  const dLon =
    (
      lon2 -
      lon1
    ) *
    Math.PI /
    180;


  const a =
    Math.sin(
      dLat / 2
    ) ** 2 +

    Math.cos(
      lat1 *
      Math.PI /
      180
    ) *

    Math.cos(
      lat2 *
      Math.PI /
      180
    ) *

    Math.sin(
      dLon / 2
    ) ** 2;


  return 2 *
    R *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(
        1 - a
      )
    );

}


/***************************************************************
 * =============================================================
 * MÓDULO 29 - GOOGLE MAPS
 * =============================================================
 ***************************************************************/


function openGoogleRoute() {

  const route =
    getActiveRoute();


  if (
    !route ||
    route.points.length < 2
  ) {

    showToast(
      'La ruta necesita al menos 2 puntos.'
    );

    return;

  }


  const points =
    route.points
      .map(
        id =>
          markersData.find(
            p =>
              p.id === id
          )
      )
      .filter(
        Boolean
      );


  const origin =
    points[0];


  const destination =
    points[
      points.length - 1
    ];


  const waypoints =
    points
      .slice(
        1,
        -1
      )
      .map(
        p =>
          p.latitud +
          ',' +
          p.longitud
      )
      .join('|');


  let url =
    'https://www.google.com/maps/dir/?api=1';


  url +=
    '&origin=' +
    encodeURIComponent(
      origin.latitud +
      ',' +
      origin.longitud
    );


  url +=
    '&destination=' +
    encodeURIComponent(
      destination.latitud +
      ',' +
      destination.longitud
    );


  if (
    waypoints
  ) {

    url +=
      '&waypoints=' +
      encodeURIComponent(
        waypoints
      );

  }


  url +=
    '&travelmode=driving';


  window.open(
    url,
    '_blank'
  );

}


/***************************************************************
 * =============================================================
 * MÓDULO 30 - KML
 * =============================================================
 ***************************************************************/


function processKML(
  fileName,
  xmlText
) {

  const parser =
    new DOMParser();


  const xml =
    parser.parseFromString(
      xmlText,
      'text/xml'
    );


  const placemarks =
    xml.getElementsByTagName(
      'Placemark'
    );


  if (
    !placemarks.length
  ) {

    showToast(
      'No se encontraron puntos.'
    );

    return;

  }


  clearMap();

  markersData = [];


  for (
    let i = 0;
    i < placemarks.length;
    i++
  ) {

    const placemark =
      placemarks[i];


    const point =
      placemark.getElementsByTagName(
        'Point'
      )[0];


    if (!point) {
      continue;
    }


    const coordinates =
      point.getElementsByTagName(
        'coordinates'
      )[0];


    if (!coordinates) {
      continue;
    }


    const values =
      coordinates
        .textContent
        .trim()
        .split(',');


    const longitud =
      parseFloat(
        values[0]
      );


    const latitud =
      parseFloat(
        values[1]
      );


    if (
      isNaN(latitud) ||
      isNaN(longitud)
    ) {

      continue;

    }


    const nameNode =
      placemark.getElementsByTagName(
        'name'
      )[0];


    const nombre =
      nameNode
        ? nameNode.textContent.trim()
        : 'Punto ' +
          (
            i + 1
          );


    const descNode =
      placemark.getElementsByTagName(
        'description'
      )[0];


    const description =
      descNode
        ? descNode.textContent
        : '';


    const descriptions =
      splitDescription(
        description
      );


    let color =
      null;


    const styleUrl =
      placemark.getElementsByTagName(
        'styleUrl'
      )[0];


    if (
      styleUrl
    ) {

      const styleId =
        styleUrl
          .textContent
          .trim()
          .replace(
            '#',
            ''
          );


      const style =
        xml.getElementById(
          styleId
        );


      if (
        style
      ) {

        const colorNode =
          style
            .getElementsByTagName(
              'color'
            )[0];


        if (
          colorNode
        ) {

          color =
            kmlColorToHex(
              colorNode
                .textContent
                .trim()
            );

        }

      }

    }


    if (
      !color
    ) {

      color =
        DEFAULT_COLORS[
          i %
          DEFAULT_COLORS.length
        ];

    }


    markersData.push({

      id:
        'kml_' +
        Date.now() +
        '_' +
        i,

      row:
        i + 1,

      orden:
        markersData.length + 1,

      nombre:
        nombre,

      latitud:
        latitud,

      longitud:
        longitud,

      desc1:
        descriptions[0] ||
        '',

      desc2:
        descriptions[1] ||
        '',

      desc3:
        descriptions[2] ||
        '',

      color:
        color,

      marker:
        null

    });

  }


  currentFile =
    fileName;


  currentFileType =
    'kml';


  currentSheetId =
    '';


  drawMarkers();

  refreshInterface();

  zoomAll();


  showToast(
    markersData.length +
    ' puntos cargados.'
  );

}

/***************************************************************
 * =============================================================
 * ENFOCAR PUNTO
 * =============================================================
 *
 * TAMBIÉN ES UTILIZADO POR EL NOMBRE DE LA TABLA.
 * =============================================================
 ***************************************************************/


function focusPoint(
  id
) {

  const point =
    markersData.find(
      p =>
        p.id === id
    );


  if (!point) {
    return;
  }


  /*
   * Si el punto estaba oculto por filtros,
   * lo hacemos visible solamente para poder
   * localizarlo.
   */

  if (
    point.marker &&
    !map.hasLayer(
      point.marker
    )
  ) {

    point.marker.addTo(
      map
    );

  }


  map.setView(
    [
      point.latitud,
      point.longitud
    ],
    18,
    {
      animate:
        true
    }
  );


  /*
   * Pequeño retraso para que el mapa
   * termine de desplazarse antes de abrir popup.
   */

  setTimeout(
    function() {

      openPointEditor(
        point
      );

    },
    250
  );

}

/***************************************************************
 * =============================================================
 * MÓDULO 36 - EXPORTAR KML
 * =============================================================
 ***************************************************************/


function downloadKML() {

  if (
    !markersData.length
  ) {

    showToast(
      'No hay puntos.'
    );

    return;

  }


  let placemarks =
    '';


  markersData.forEach(
    function(point) {

      placemarks += `

        <Placemark>

          <name>
            ${escapeXml(point.nombre)}
          </name>

          <description>
            <![CDATA[
              ${escapeHtml(point.desc1)}
              <br>
              ${escapeHtml(point.desc2)}
              <br>
              ${escapeHtml(point.desc3)}
            ]]>
          </description>

          <Style>

            <IconStyle>

              <color>
                ${hexToKmlColor(point.color)}
              </color>

              <scale>
                1.1
              </scale>

            </IconStyle>

          </Style>

          <Point>

            <coordinates>
              ${point.longitud},
              ${point.latitud},
              0
            </coordinates>

          </Point>

        </Placemark>

      `;

    }
  );


  routes.forEach(
    function(route) {

      if (
        route.points.length < 2
      ) {

        return;

      }


      const coordinates =
        route.points
          .map(
            id =>
              markersData.find(
                p =>
                  p.id === id
              )
          )
          .filter(
            Boolean
          )
          .map(
            p =>
              p.longitud +
              ',' +
              p.latitud +
              ',0'
          )
          .join(' ');


      placemarks += `

        <Placemark>

          <name>
            ${escapeXml(route.name)}
          </name>

          <Style>

            <LineStyle>

              <color>
                ff2563eb
              </color>

              <width>
                5
              </width>

            </LineStyle>

          </Style>

          <LineString>

            <tessellate>
              1
            </tessellate>

            <coordinates>
              ${coordinates}
            </coordinates>

          </LineString>

        </Placemark>

      `;

    }
  );


  const kml = `

<?xml version="1.0" encoding="UTF-8"?>

<kml
  xmlns="http://www.opengis.net/kml/2.2"
>

<Document>

  <name>
    Visualizador
  </name>

  ${placemarks}

</Document>

</kml>

`;


  const blob =
    new Blob(
      [kml],
      {
        type:
          'application/vnd.google-earth.kml+xml'
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      'a'
    );


  a.href =
    url;


  a.download =
    'mapa_actualizado.kml';


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  URL.revokeObjectURL(
    url
  );


  showToast(
    'KML generado.'
  );

}


/***************************************************************
 * =============================================================
 * MÓDULO 37 - DESCRIPCIONES KML
 * =============================================================
 ***************************************************************/


function splitDescription(
  description
) {

  if (!description) {
    return [];
  }


  let text =
    description
      .replace(
        /<br\s*\/?>/gi,
        '\n'
      )
      .replace(
        /<\/p>/gi,
        '\n'
      )
      .replace(
        /<[^>]*>/g,
        ''
      );


  text =
    decodeHtml(
      text
    );


  let parts;


  if (
    text.includes('\n')
  ) {

    parts =
      text.split(
        /\n+/
      );

  } else if (
    text.includes('|')
  ) {

    parts =
      text.split('|');

  } else if (
    text.includes(';')
  ) {

    parts =
      text.split(';');

  } else {

    parts =
      [text];

  }


  return parts
    .map(
      p =>
        p.trim()
    )
    .filter(
      Boolean
    );

}


/***************************************************************
 * =============================================================
 * MÓDULO 38 - COLORES KML
 * =============================================================
 ***************************************************************/


function kmlColorToHex(
  value
) {

  let color =
    value
      .replace(
        '#',
        ''
      )
      .trim();


  if (
    color.length === 8
  ) {

    const rr =
      color.substring(
        6,
        8
      );


    const gg =
      color.substring(
        4,
        6
      );


    const bb =
      color.substring(
        2,
        4
      );


    return '#' +
      rr +
      gg +
      bb;

  }


  if (
    color.length === 6
  ) {

    return '#' +
      color;

  }


  return '#FF0000';

}


function hexToKmlColor(
  hex
) {

  let color =
    String(
      hex ||
      '#FF0000'
    )
      .replace(
        '#',
        ''
      );


  if (
    color.length !== 6
  ) {

    color =
      'FF0000';

  }


  const rr =
    color.substring(
      0,
      2
    );


  const gg =
    color.substring(
      2,
      4
    );


  const bb =
    color.substring(
      4,
      6
    );


  return 'ff' +
    bb +
    gg +
    rr;

}


/***************************************************************
 * =============================================================
 * MÓDULO 39 - RUTAS - RENDERIZAR
 * =============================================================
 ***************************************************************/


function renderRoutes() {

  const select =
    document.getElementById(
      'route-select'
    );


  if (!select) {
    return;
  }


  select.innerHTML =
    '<option value="">-- Sin ruta --</option>';


  routes.forEach(
    function(route) {

      const option =
        document.createElement(
          'option'
        );


      option.value =
        route.id;


      option.textContent =
        route.name;


      if (
        route.id ===
        activeRouteId
      ) {

        option.selected =
          true;

      }


      select.appendChild(
        option
      );

    }
  );


  updateRoutePanel();

}


/***************************************************************
 * =============================================================
 * MÓDULO 40 - UTILIDADES
 * =============================================================
 ***************************************************************/


function escapeHtml(
  value
) {

  return String(
    value ?? ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


function escapeXml(
  value
) {

  return String(
    value ?? ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&apos;'
    );

}


function decodeHtml(
  value
) {

  const textarea =
    document.createElement(
      'textarea'
    );


  textarea.innerHTML =
    value;


  return textarea.value;

}


/***************************************************************
 * =============================================================
 * MÓDULO 41 - TOAST
 * =============================================================
 ***************************************************************/


let toastTimer;


function showToast(
  message
) {

  const toast =
    document.getElementById(
      'toast'
    );


  const text =
    document.getElementById(
      'toast-text'
    );


  text.textContent =
    message;


  toast.classList.add(
    'show'
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      function() {

        toast.classList.remove(
          'show'
        );

      },
      3000
    );

}
